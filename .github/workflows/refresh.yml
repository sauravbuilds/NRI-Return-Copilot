name: Refresh official documents

on:
  schedule:
    - cron: "0 3 */3 * *"   # every 3 days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh documents and rebuild index if changed
        run: python scripts/refresh.py
      - name: Commit updated files
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data/official data/archive data/refresh_log.md
          git diff --cached --quiet || git commit -m "Refresh official documents"
          git push
